name: tangostar
channels:
  - pytorch
  - nvidia
  - conda-forge
  - defaults
dependencies:
  - python>=3.8
  - pytorch=2.5.0
  - pytorch-cuda=12.1
  - cuda-toolkit
  - networkx
  - python-graphviz
  - numpy
  - scipy
  - pandas
  - tqdm
  - faiss-gpu
  - pip:
    - rdkit
    - rdchiral
    - psutil
